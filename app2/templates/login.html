<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Acceso</title>
    {% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/login-styles.css' %}?v=2.0">
</head>
<body class="admin-login">
    <div class="login-card">
        <!-- Logo y título -->
        <div class="login-header">
            <div class="logo-container" style="text-align: center; margin-bottom: 1.5rem;">
                <img src="{% static 'wagner-img/lume-logo.png' %}" alt="Logo Clínica Lume" style="max-width: 140px; height: auto;" class="logo-img">
            </div>
            <h1 class="login-title" style="font-family: var(--font-heading); font-size: 2.5rem; color: var(--foreground); margin-bottom: 0.2rem;">Clínica Lume</h1>
            <p class="login-subtitle" style="font-family: var(--font-sans); color: var(--primary); font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; border: none; text-decoration: none;">Portal de Administración</p>
        </div>
        
        <!-- Mensajes de error -->
        {% if messages %}
        <div class="alert-premium-danger" style="background: #FFFAFA; border: 1px solid #FFE4E4; border-left: 4px solid #E74C3C; color: #C0392B; padding: 1rem 1.2rem; border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; box-shadow: 0 10px 25px rgba(231,76,60,0.08); animation: fadeIn 0.4s ease-out;">
            <i class="fas fa-exclamation-circle" style="font-size: 1.4rem;"></i>
            <div style="font-family: var(--font-sans); font-size: 0.9rem; font-weight: 500; line-height: 1.4;">
                {% for message in messages %}
                    <p style="margin: 0;">{{ message }}</p>
                {% endfor %}
            </div>
        </div>
        {% endif %}
        
        <!-- Formulario de inicio de sesión -->
        <form class="login-form" method="post">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="nombre" style="font-family: var(--font-sans); font-size: 0.85rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 1px;">Usuario</label>
                <div class="input-wrapper" style="position: relative; margin-top: 0.5rem;">
                    <i class="fas fa-user input-icon" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: #C8A462;"></i>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresa tu usuario" required autofocus style="width: 100%; padding: 1rem 1rem 1rem 3rem; border: 1px solid #E5E5E5; border-radius: 12px; font-family: var(--font-sans); font-size: 0.95rem; background: #FAFAFA; transition: all 0.3s;">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password" style="font-family: var(--font-sans); font-size: 0.85rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 1px;">Contraseña</label>
                <div class="input-wrapper" style="position: relative; margin-top: 0.5rem;">
                    <i class="fas fa-lock input-icon" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: #C8A462;"></i>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña" required style="width: 100%; padding: 1rem 3rem; border: 1px solid #E5E5E5; border-radius: 12px; font-family: var(--font-sans); font-size: 0.95rem; background: #FAFAFA; transition: all 0.3s;">
                    <button type="button" class="password-toggle" onclick="togglePassword()" style="position: absolute; right: 1.2rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #AAA; cursor: pointer;">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-login" style="background-color: #C8A462; color: #FFF; width: 100%; padding: 1rem; border: none; border-radius: 12px; font-family: var(--font-sans); font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 0.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(200,164,98,0.2);">
                <i class="fas fa-sign-in-alt"></i>
                <span>Ingresar al Portal</span>
            </button>
        </form>
        
        <div class="login-footer">
            <p>© 2026 Clínica Lume - Todos los derechos reservados</p>
        </div>
    </div>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    
    <!-- Scripts adicionales -->
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.classList.remove('fa-eye');
                toggleBtn.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleBtn.classList.remove('fa-eye-slash');
                toggleBtn.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
