{% extends 'base_app2.html' %}
{% block title %}Perfil - Clínica Lume{% endblock %}

{% block content %}
<h1 class="page-title">Configuración del Negocio</h1>

<div class="card" style="max-width: 840px;">
    <h3 style="margin-bottom: 1.8rem; font-family: var(--font-heading); font-size: 2.2rem; color: var(--color-text-main);">Información General</h3>
    <form method="POST">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
            <div class="form-group" style="margin-bottom: 0;">
                <label>Nombre del Negocio</label>
                <input type="text" name="nombre_negocio" class="form-control" value="{{ config.nombre_negocio }}">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Teléfono Principal (WhatsApp)</label>
                <input type="text" name="telefono_whatsapp" class="form-control" value="{{ config.telefono_whatsapp|default_if_none:'' }}" placeholder="Ej. 5491166380592">
            </div>
        </div>
        <div class="form-group" style="margin-top: 1.5rem;">
            <label>Dirección</label>
            <input type="text" name="direccion" class="form-control" value="{{ config.direccion|default_if_none:'' }}">
        </div>
        <div class="form-group">
            <label>Horarios de Atención</label>
            <textarea name="horarios" class="form-control" rows="3">{{ config.horarios|default_if_none:'' }}</textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
            <button type="submit" class="btn-primary" style="min-width: 200px;">Guardar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
